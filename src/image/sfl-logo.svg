<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-label="Swift Freight Logistics">
  <defs>
    <!-- Deep navy-to-blue background -->
    <linearGradient id="sfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#06112b"/>
      <stop offset="52%"  stop-color="#0e2570"/>
      <stop offset="100%" stop-color="#1a3fa0"/>
    </linearGradient>
    <!-- Nose-area glow -->
    <radialGradient id="sfGlow" cx="72%" cy="30%" r="52%">
      <stop offset="0%"   stop-color="rgba(59,130,246,0.28)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <!-- Cockpit window fill -->
    <radialGradient id="sfCock" cx="40%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="rgba(147,210,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0.35)"/>
    </radialGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="56" height="56" rx="13" fill="url(#sfBg)"/>
  <!-- Surface sheen -->
  <rect x="0" y="0" width="56" height="22" rx="13" fill="rgba(255,255,255,0.035)"/>
  <!-- Top edge highlight -->
  <line x1="13" y1="1.3" x2="43" y2="1.3" stroke="rgba(255,255,255,0.11)" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Soft glow toward nose (upper-right after rotation) -->
  <ellipse cx="38" cy="17" rx="16" ry="11" fill="url(#sfGlow)"/>
  <!-- Outer border accent -->
  <rect width="56" height="56" rx="13" stroke="rgba(59,130,246,0.28)" stroke-width="0.8" fill="none"/>

  <!-- ══ Cargo aircraft — plan (top-down) view, nose pointing upper-right ══ -->
  <!-- Base orientation: nose at x=50 (right), tail at x=13 (left), centred at y=28 -->
  <!-- Rotated -28° around icon centre so nose faces upper-right -->
  <g transform="rotate(-28, 28, 28)">

    <!-- Horizontal tail stabilisers (drawn first; fuselage rendered over their roots) -->
    <path d="M 15,27 L 7,22.5 L 16,26.2 Z" fill="rgba(255,255,255,0.55)"/>
    <path d="M 15,29 L 7,33.5 L 16,29.8 Z" fill="rgba(255,255,255,0.55)"/>

    <!-- Main wings — swept-back delta, typical widebody cargo -->
    <!-- Upper wing -->
    <path d="M 31,26 L 16,6  L 27,26 Z" fill="rgba(255,255,255,0.88)"/>
    <!-- Lower wing (mirror) -->
    <path d="M 31,30 L 16,50 L 27,30 Z" fill="rgba(255,255,255,0.88)"/>

    <!-- Fuselage — widebody cargo shape; wide at centre, tapered at both ends -->
    <path d="M 13,26.5 C 22,23 40,23 50,28 C 40,33 22,33 13,29.5 Z" fill="white"/>

    <!-- Engine nacelles on wings (~40% span, aligned to wing leading-edge angle) -->
    <ellipse cx="23" cy="15" rx="3.2" ry="1.5" transform="rotate(-52, 23, 15)"
             fill="rgba(210,230,255,0.9)"/>
    <ellipse cx="23" cy="41" rx="3.2" ry="1.5" transform="rotate( 52, 23, 41)"
             fill="rgba(210,230,255,0.9)"/>

    <!-- Cockpit windows — blue-tinted ellipse near nose -->
    <ellipse cx="44" cy="27.6" rx="3" ry="1.6" fill="url(#sfCock)"/>
    <ellipse cx="43.5" cy="27.2" rx="1.3" ry="0.7" fill="rgba(200,235,255,0.65)"/>

    <!-- Nose tip highlight -->
    <circle cx="49.5" cy="28" r="1.2" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
