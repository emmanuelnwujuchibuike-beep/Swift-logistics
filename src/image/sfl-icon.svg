<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Swift Freight Logistics">
  <defs>
    <!-- Rich dark background -->
    <linearGradient id="bg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#081632"/>
      <stop offset="55%"  stop-color="#051022"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>
    <!-- Strong blue centre glow -->
    <radialGradient id="cg" cx="52%" cy="46%" r="54%">
      <stop offset="0%"   stop-color="#1a3a8f" stop-opacity=".58"/>
      <stop offset="55%"  stop-color="#0f2060" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Top-right corner blue ambient -->
    <radialGradient id="tr-g" cx="90%" cy="6%" r="44%">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottom-left shadow depth -->
    <radialGradient id="bl-g" cx="8%" cy="94%" r="40%">
      <stop offset="0%"   stop-color="#000510" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Visible diamond crosshatch grid -->
    <pattern id="grid" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <line x1="0"  y1="0"  x2="14" y2="14" stroke="#2563eb" stroke-width=".7" opacity=".28"/>
      <line x1="14" y1="0"  x2="0"  y2="14" stroke="#2563eb" stroke-width=".7" opacity=".28"/>
    </pattern>
    <!-- Truck gradients -->
    <linearGradient id="cargo-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cab-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════ BACKGROUND ═══════════════════ -->

  <!-- 1. Base dark gradient -->
  <rect width="100" height="100" rx="22" fill="url(#bg-g)"/>
  <!-- 2. Strong centre depth glow -->
  <rect width="100" height="100" rx="22" fill="url(#cg)"/>
  <!-- 3. Diamond crosshatch grid (clearly visible) -->
  <rect width="100" height="100" rx="22" fill="url(#grid)"/>
  <!-- 4. Top-right corner ambient -->
  <rect width="100" height="100" rx="22" fill="url(#tr-g)"/>
  <!-- 5. Bottom-left shadow -->
  <rect width="100" height="100" rx="22" fill="url(#bl-g)"/>

  <!-- 6. Glowing inner border ring -->
  <rect x="2"   y="2"   width="96" height="96" rx="20.5"
        fill="none" stroke="#2563eb" stroke-width="1.8" opacity=".42"/>
  <!-- 7. Outer halo ring -->
  <rect x=".6"  y=".6"  width="98.8" height="98.8" rx="21.5"
        fill="none" stroke="#60a5fa" stroke-width=".8" opacity=".14"/>

  <!-- 8. Corner L-brackets — premium viewfinder marks -->
  <!-- Top-left -->
  <path d="M10,22 L10,10 L22,10"
        fill="none" stroke="#3b82f6" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <!-- Top-right -->
  <path d="M78,10 L90,10 L90,22"
        fill="none" stroke="#3b82f6" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <!-- Bottom-left -->
  <path d="M10,78 L10,90 L22,90"
        fill="none" stroke="#3b82f6" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <!-- Bottom-right -->
  <path d="M78,90 L90,90 L90,78"
        fill="none" stroke="#3b82f6" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>

  <!-- 9. 4-point star sparkle (top-right) -->
  <!-- Glow halo -->
  <circle cx="83.5" cy="14" r="5" fill="#1d4ed8" opacity=".3"/>
  <!-- Star shape -->
  <path d="M83.5,8 L85.2,12 L89.5,14 L85.2,16 L83.5,20 L81.8,16 L77.5,14 L81.8,12 Z"
        fill="#93c5fd" opacity=".75"/>
  <!-- Star centre dot -->
  <circle cx="83.5" cy="14" r="1.4" fill="#dbeafe" opacity=".9"/>

  <!-- 10. Horizon accent lines (bottom) -->
  <line x1="14" y1="88" x2="86" y2="88"
        stroke="#2563eb" stroke-width="1.1" stroke-linecap="round" opacity=".45"/>
  <line x1="22" y1="92" x2="78" y2="92"
        stroke="#1d4ed8" stroke-width=".8" stroke-linecap="round" opacity=".28"/>

  <!-- ═══════════════════ TRUCK (62 %, centred) ════════════════════ -->
  <g transform="translate(19,19) scale(0.62)">

    <!-- Ambient haze -->
    <ellipse cx="54" cy="43" rx="32" ry="22" fill="#1d4ed8" opacity=".1"/>
    <!-- Ground shadow -->
    <ellipse cx="52" cy="83" rx="36" ry="3" fill="#3b82f6" opacity=".22"/>

    <!-- Speed lines -->
    <rect x="2" y="27" width="8"  height="2.5" rx="1.25" fill="#60a5fa" opacity=".72"/>
    <rect x="2" y="34" width="5"  height="2"   rx="1"    fill="#60a5fa" opacity=".5"/>
    <rect x="2" y="41" width="7"  height="1.5" rx=".75"  fill="#60a5fa" opacity=".34"/>
    <rect x="2" y="48" width="4"  height="1.5" rx=".75"  fill="#60a5fa" opacity=".2"/>

    <!-- Cargo box -->
    <rect x="12" y="17" width="48" height="45" rx="5" fill="url(#cargo-g)"/>
    <rect x="12" y="17" width="48" height="7"  rx="3.5" fill="rgba(255,255,255,.17)"/>
    <rect x="12" y="17" width="48" height="2.5" rx="1.25" fill="#93c5fd" opacity=".55"/>
    <rect x="12" y="40" width="48" height="1.5" rx=".75" fill="rgba(0,0,0,.18)"/>
    <rect x="56" y="17" width="4"  height="45" rx="2" fill="rgba(0,0,0,.14)"/>

    <!-- Cab -->
    <path d="M60 25 L60 62 L90 62 L90 47 Q90 25 75 25 Z" fill="url(#cab-g)"/>
    <path d="M64 25 Q75 23 89 30 L89 26 Q76 21 64 25 Z" fill="#bfdbfe" opacity=".3"/>

    <!-- Windshield -->
    <path d="M62 27 L62 45 L88 45 Q87.5 27 75 27 Z" fill="#020b1d" opacity=".58"/>
    <rect x="64" y="29" width="8" height="10" rx="2" fill="rgba(255,255,255,.09)"/>

    <!-- Mirror -->
    <rect x="87" y="30" width="5" height="9" rx="2.5" fill="#2563eb"/>
    <rect x="88" y="32" width="3" height="5" rx="1"   fill="#020b1d" opacity=".45"/>

    <!-- Chassis -->
    <rect x="12" y="62" width="78" height="4" rx="2" fill="#1e3a8a"/>
    <rect x="12" y="64" width="78" height="2" rx="1" fill="rgba(59,130,246,.25)"/>

    <!-- Rear wheel -->
    <circle cx="28" cy="73" r="10.5" fill="#020b1d"/>
    <circle cx="28" cy="73" r="8"    fill="#0d1b36"/>
    <circle cx="28" cy="73" r="5"    fill="#1d4ed8"/>
    <circle cx="28" cy="73" r="2"    fill="#93c5fd"/>
    <circle cx="28" cy="73" r="8" fill="none" stroke="#3b82f6" stroke-width="1" opacity=".5"/>

    <!-- Front wheel -->
    <circle cx="76" cy="73" r="10.5" fill="#020b1d"/>
    <circle cx="76" cy="73" r="8"    fill="#0d1b36"/>
    <circle cx="76" cy="73" r="5"    fill="#1d4ed8"/>
    <circle cx="76" cy="73" r="2"    fill="#93c5fd"/>
    <circle cx="76" cy="73" r="8" fill="none" stroke="#3b82f6" stroke-width="1" opacity=".5"/>

  </g>
</svg>
