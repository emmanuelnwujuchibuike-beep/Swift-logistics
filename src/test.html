<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="input.css">
    <link rel="icon" type="image/png" href="./image/logo.png" class="">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
        <nav class="fixed top-0 left-0 z-[100] flex w-full items-center justify-between p-6 bg-transparent">
    <div class="text-2xl font-black text-white uppercase tracking-tighter">
        Swift<span class="text-blue-600">Bolt</span>
    </div>

    <button id="menu-btn" class="relative z-[110] h-12 w-12 flex items-center justify-center rounded-xl bg-blue-950 shadow-lg transition-all hover:scale-110 active:scale-95">
        <div class="relative h-5 w-6">
            <span id="line-1" class="absolute block h-0.5 w-full bg-white transition-all duration-500 ease-in-out origin-center -translate-y-2"></span>
            <span id="line-2" class="absolute block h-0.5 w-full bg-white transition-all duration-500 ease-in-out origin-center"></span>
            <span id="line-3" class="absolute block h-0.5 w-full bg-white transition-all duration-500 ease-in-out origin-center translate-y-2"></span>
        </div>
    </button>
</nav>

<div id="overlay" class="fixed inset-0 z-[80] hidden bg-black/20 backdrop-blur-md transition-opacity duration-500 opacity-0"></div>

<div id="side-menu" class="fixed top-0 right-0 z-[90] h-screen w-full sm:w-[400px] translate-x-full bg-white shadow-[-20px_0_50px_rgba(0,0,0,0.1)] transition-transform duration-700 ease-[cubic-bezier(0.23,1,0.32,1)]">
    <div class="flex flex-col h-full pt-32 px-10">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-10">Navigation</h2>
        <ul class="space-y-6">
            <li><a href="#" class="text-3xl font-bold text-blue-950 hover:text-blue-600 transition-colors">Home</a></li>
            <li><a href="#" class="text-3xl font-bold text-blue-950 hover:text-blue-600 transition-colors">Track Shipment</a></li>
            <li><a href="#" class="text-3xl font-bold text-blue-950 hover:text-blue-600 transition-colors">Our Services</a></li>
            <li><a href="#" class="text-3xl font-bold text-blue-950 hover:text-blue-600 transition-colors">Contact</a></li>
        </ul>
        
        <div class="mt-auto mb-12">
            <button class="w-full rounded-xl bg-blue-950 py-4 text-white font-bold shadow-xl hover:bg-blue-900 transition-all">
                Get a Quote
            </button>
        </div>
    </div>
</div>




<script>
    const menuBtn = document.getElementById('menu-btn');
    const sideMenu = document.getElementById('side-menu');
    const overlay = document.getElementById('overlay');
    const l1 = document.getElementById('line-1');
    const l2 = document.getElementById('line-2');
    const l3 = document.getElementById('line-3');

    menuBtn.addEventListener('click', () => {
        // Toggle the side menu
        const isOpen = sideMenu.classList.toggle('translate-x-full');
        
        if (!isOpen) {
            // OPEN STATE
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.add('opacity-100'), 10);
            
            // Morph to X
            l1.classList.replace('-translate-y-2', 'rotate-45');
            l2.classList.add('opacity-0', '-translate-x-2');
            l3.classList.replace('translate-y-2', '-rotate-45');
        } else {
            // CLOSE STATE
            overlay.classList.remove('opacity-100');
            setTimeout(() => overlay.classList.add('hidden'), 500);
            
            // Morph back to Hamburger
            l1.classList.replace('rotate-45', '-translate-y-2');
            l2.classList.remove('opacity-0', '-translate-x-2');
            l3.classList.replace('-rotate-45', 'translate-y-2');
        }
    });

    // Close menu if clicking the blurred area
    overlay.addEventListener('click', () => menuBtn.click());
</script>
</body>
</html>
